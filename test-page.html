<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>生图</title>
<style>body{background:#0e0e11;color:#e4e4ea;font-family:sans-serif;padding:40px;max-width:600px;margin:0 auto}
textarea{width:100%;height:60px;background:#1a1a22;color:#e4e4ea;border:1px solid #333;border-radius:6px;padding:10px;font-size:14px}
button{padding:10px 24px;background:#6c9ef8;color:#000;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-top:10px}
img{max-width:100%;margin-top:16px;border-radius:8px}
#st{margin-top:10px;color:#8a8a98}</style>
</head><body>
<h2>SenseNova 生图</h2>
<textarea id="p" placeholder="描述要生成的图…">赛博朋克风格的紫色河马</textarea><br>
<button onclick="gen()" id="btn">⚡ 生成</button>
<div id="st"></div>
<div id="out"></div>
<script>
async function gen(){
  const st=document.getElementById('st'),out=document.getElementById('out'),btn=document.getElementById('btn');
  st.textContent='生成中…';btn.disabled=true;out.innerHTML='';
  try{
    const r=await fetch('/api/sensenova/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:document.getElementById('p').value})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'HTTP '+r.status);
    const src=d.image.kind==='url'?d.image.value:'data:image/png;base64,'+d.image.value;
    out.innerHTML='<img src="'+src+'">';
    st.textContent='✓ 完成';
  }catch(e){st.textContent='失败: '+e.message}
  btn.disabled=false;
}
</script>
</body></html>
